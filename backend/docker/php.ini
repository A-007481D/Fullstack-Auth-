; PHP configuration for production-like settings inside Docker

; Security: don't expose PHP version in headers
expose_php = Off

; Memory limit — Laravel + Eloquent can use significant memory on large queries
memory_limit = 256M

; Upload limits (not critical for an API, but good practice)
upload_max_filesize = 10M
post_max_size = 10M

; Execution time
max_execution_time = 60

; OPcache — pre-compiles PHP files for significant performance gain
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
